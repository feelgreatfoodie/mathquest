name: Test and deploy

on:
  push:
    branches: [main]
  # labeled and unlabeled re-run the what's-new check when "no-whatsnew" is added or removed.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A PR may not add a real kid doc id, the family id or a real first name. Compares SHA-256 hashes of the
      # added lines, file paths and commit messages with scripts/private-id-hashes.txt. No secret is needed.
      - name: No private ids in the PR
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          { git diff --unified=0 "$base...HEAD"; git log --format=%B "$base..HEAD" | sed 's/^/+/'; } | node scripts/check-private-ids.mjs
      - run: npm ci
      # functions/test/clientip.test.ts imports functions/src/core.ts, which needs the functions deps.
      - run: npm ci --prefix functions
      - run: npm run typecheck
      - run: npm test

  # A PR that changes src/ must add a line to src/whatsnew.ts, or carry the "no-whatsnew" label.
  whatsnew:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-whatsnew.mjs
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Off until Flynn approves Workload Identity Federation (GCP_WIF_PROVIDER and GCP_DEPLOY_SA are unset,
  # so the auth step failed on every push). Deploys run by hand with `npm run deploy`; see README.
  deploy:
    if: false
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      # Keyless auth: Workload Identity Federation to a deploy service account.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - run: npx firebase-tools@latest deploy --only hosting,firestore:rules,firestore:indexes --project ${{ vars.VITE_FIREBASE_PROJECT_ID }} --non-interactive
      # The release step: tell old bundles to update. Only after the new bundle is live (the script waits for /version.json).
      - run: npm --prefix functions ci
      - run: node scripts/set-min-version.mjs --project ${{ vars.VITE_FIREBASE_PROJECT_ID }} --url ${{ vars.APP_URL }}
